<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Beyond The Prompt: an event on agentic AI, autonomous systems and the people building them." />
    <meta name="theme-color" content="#07080d" />
    <title>Beyond The Prompt</title>

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <!-- Order matters: reset → tokens → base/components -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/main.css" />

    <script type="module" src="scripts/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="#">
          <img src="assets/icons/favicon.svg" alt="" width="28" height="28" />
          <span>Beyond The Prompt</span>
        </a>
        <a class="btn btn--primary" href="#register">Register</a>
      </div>
    </header>

    <main id="main">
      <section class="hero section" aria-labelledby="hero-title">
        <div class="container stack" style="--stack-space: var(--space-6)">
          <p class="eyebrow">AI &amp; Agentic Systems Event</p>
          <h1 id="hero-title" class="hero__title">
            Go <span class="text-gradient">beyond the prompt</span>.
          </h1>
          <p class="hero__lead text-muted">
            A placeholder hero that exercises the design tokens. Real content lands in follow-up issues.
          </p>
          <div class="cluster">
            <a class="btn btn--primary" href="#register">Save your seat</a>
            <a class="btn btn--ghost" href="#agenda">View agenda</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span data-current-year>2026</span> Beyond The Prompt</p>
      </div>
    </footer>
  </body>
</html>
